# Ball Knowledge — every tunable lives here.
# Values marked "starting value" come from CLAUDE.md / docs/DESIGN.md and get tuned in simulation (step 4).
# Lines marked TBD are deliberately unset: the docs leave them open, so they're decided in the step that needs them.

# ---------------------------------------------------------------------------
# The dive
# ---------------------------------------------------------------------------
[dive]
prompts_per_dive = 7
seconds_per_prompt = 25
# grace_seconds = TBD (step 5) — "small grace" after the 25 s timer
# reset_time = TBD — assumed midnight US Eastern, open question for T

# ---------------------------------------------------------------------------
# Rarity tiers (starting values). Cumulative share of predicted picks, most obvious first.
# ---------------------------------------------------------------------------
[tiers]
names = ["Bandwagon", "Casual", "Real One", "Deep Cut", "You Know Ball"]
cumulative_share = [0.50, 0.75, 0.90, 0.98, 1.00]
points = [10, 25, 50, 75, 100]
hipster_pick_points = 15

[rarity]
# Posterior pick share blends predicted and observed; the prediction is worth this many picks.
prior_weight_picks = 50
# Auto-flag a Hipster Pick (not wired yet): its posterior share is at least this multiple of the predicted share,
hipster_auto_flag_ratio = 3.0
# it was picked at least this many times,
hipster_min_picks = 5
# and its base tier is at least this deep (3 = Real One): an obvious answer is never a Hipster Pick.
hipster_min_tier = 3
# An answer flagged weak_stint (its dates are uncertain) never counts deeper than this tier (3 = Real One), so
# it is worth at most that tier's points. T 2026-11-11. Edge-flagged answers are not capped. The tier gate runs
# on the capped tiers.
weak_answer_max_tier = 3

# Pick-share model (step 3): share is proportional to
#   (V + fame_floor_views)^alpha * (1 + tie)^beta * 2^(-seasons_since / half_life_seasons)
# Starting values; chunk 2 tunes them against the sample tables and T's gut lists.
[rarity.model]
# Exponent on fame V: 10x the views gives 10^alpha = 4x the picks. T 2026-11-11, from the gut sweep
# (the design started at 0.8).
alpha = 0.6
# Exponent on tie (appearances or match equivalents): a 300-app regular gets about 8.7x a 3-app cameo.
beta = 0.5
# Seasons for the picks to halve since the answer's last tie to the prompt.
half_life_seasons = 10
# Added to V so an answer with no pageviews has a finite score.
fame_floor_views = 100

# Tier gate (step 3): blocks a prompt whose answers cannot spread over the five tiers. Every tier must be
# non-empty, and Bandwagon holds at most this share of the answers (the count, not the pick share).
[rarity.tier_gate]
max_bandwagon_answer_share = 0.34

# Obviousness features (step 3). Fame is V = w_de * pageviews_de + w_en * pageviews_en, summed over all
# months, with per-competition weights keyed by the competition's Wikidata QID. English Wikipedia has about
# 2.6x the person views of German Wikipedia, so en 0.4 gives the two editions roughly equal weight.
# T (2026-11-11): testers are mixed / international, so both editions count.
[rarity.fame_weights.Q82595]  # Bundesliga
de = 1.0
en = 0.4

[rarity.features]
# Shortest tenure a spell counts for, in seasons: a caretaker coach or a loan still tied a person to the club.
min_spell_seasons = 0.5
# Appearances per season assumed when a spell has no appearance count (null, not zero). Measured 2026-11-11:
# the median of apps / years for dated spells that have apps is 16.3.
imputed_apps_per_season = 16
# A (club, season) pair that every spell only touches at its edge (a mid-season move) counts for this much.
edge_season_weight = 0.5

[rarity.calibration]
# `rarity gut-sheet`: passing prompts picked per template (all of them if there are fewer), and the seed.
gut_sheet_prompts_per_template = 2
gut_sheet_seed = 7

# ---------------------------------------------------------------------------
# Prompt generation (step 2)
# ---------------------------------------------------------------------------
[prompts]
# An open-ended spell that started within this many of the latest competition seasons in the data
# counts as current (not weak). 2 with a latest season of 2025-26 means start_year >= 2024.
open_ended_current_seasons = 2
# Countries that never become a prompt parameter. T (2026-11-11): no former states for now. These are
# the countries in our data that Wikidata marks as dissolved (P576), checked 2026-11-11.
excluded_countries = [
  "Q16957",     # East Germany
  "Q33946",     # Czechoslovakia
  "Q15180",     # Soviet Union
  "Q83286",     # Socialist Federal Republic of Yugoslavia
  "Q37024",     # Serbia and Montenegro
  "Q713750",    # West Germany
  "Q838261",    # Federal Republic of Yugoslavia
  "Q36704",     # Yugoslavia
  "Q107258515", # Pahlavi Iran
]

# ---------------------------------------------------------------------------
# Prompt quality gates (step 2; the tier gate is under [rarity.tier_gate])
# ---------------------------------------------------------------------------
[quality_gates]
# T: leaning 12, revisit later. Bayern + Dortmund has 12 answers.
min_answers = 12
max_answers = 300
# The report shows how many prompts would pass (size, then the tier gate) at each of these minimums.
report_min_answers_alternatives = [10, 12, 15]
# Report: passing prompts sampled per template, and the sampling seed.
report_sample_per_template = 3
report_sample_seed = 7
completeness_expected_answers = 20

# ---------------------------------------------------------------------------
# Rating — Glicko-2 (starting values)
# ---------------------------------------------------------------------------
[glicko]
initial_rating = 1500
initial_rd = 350
initial_volatility = 0.06
# Volatility constraint. Glickman suggests 0.3 to 1.2; smaller keeps volatility steadier. The step-4 sweep
# found it barely matters (0.2-1.2 change rank recovery in the 4th decimal); kept at 0.5.
tau = 0.5
# Convergence tolerance of the volatility step (Illinois algorithm); more than 100 iterations is an error.
volatility_epsilon = 0.000001
# RD a new child scope (a club) starts with, unless its parent's RD is higher. The step-4 sweep found no
# measurable effect between 150 and 350; kept at 250.
child_scope_initial_rd = 250
# Weight of one game in a period: v = 1 / sum(w g^2 E (1-E)), delta = v * sum(w g (s - E)). 1.0 is standard
# Glicko-2. T (2026-11-12) kept 1.0: the sweep's calibrated 4.0 sizes RD right but ranks slightly worse and
# weakens the uncertain marker; at 1.0 RD runs about 2x cautious (newcomers stay "uncertain" a little longer).
game_weight = 1.0
# At game_weight 1.0, players above this RD are misplaced about 9x as often as settled ones (step-4 sim).
# Re-tune it if game_weight changes.
uncertain_rd_threshold = 110
# T (2026-11-12): 10, from the step-4 sim. At ~18 prompts per club in two months, 97% of daily fans see their
# club rating (median day 28, rank accuracy 0.90); at 20 only half would. Shown with the uncertain marker.
club_rating_min_prompts = 10
prompt_lock_answers = 200
# irt_refit_min_rated_answers = 1000 (later, not first build)

# A prompt's starting rating: seed_rating = intercept + sum(coefficient_k * feature_k) (+ per-template offsets,
# none fitted). Features are frozen in prompts.rarity at approval: log_recall_mass, and ln_n_eff = ln of
# gate_results.tiers.n_eff. Fitted in the step-4 sim (leave-one-template-out CV RMSE 21, 23 in the model-wrong
# world) and approved by T on 2026-11-12. Refit from real results once there are enough.
[glicko.prompt_seed]
intercept = 2476.79
# RD of a fresh prompt rating: how far the seed may be off. CV error is ~23; the floor of 60 is a hedge for
# the simulation not being the real world.
rd = 60
coefficients = { log_recall_mass = -71.0242, ln_n_eff = 36.3276 }

# ---------------------------------------------------------------------------
# LLM
# ---------------------------------------------------------------------------
[llm]
prompt_model = "claude-sonnet-5-5"
answer_check_model = "claude-haiku-5-5"
monthly_budget_usd = 20

# ---------------------------------------------------------------------------
# Ingest (step 1)
# ---------------------------------------------------------------------------
[ingest]
# Wikidata item for the competition being ingested.
competition_qid = "Q82595"
# Seasons starting in this year or later define the club set; stints must reach this year.
start_year = 2000
# Stints whose dates don't prove start_year onward (no dates, or an early start with no end)
# are kept, flagged, only for people born in this year or later.
undated_min_birth_year = 1965
# Label/alias languages, in canonical-name preference order.
label_languages = ["en", "de", "mul"]

[ingest.wikidata]
sparql_endpoint = "https://query.wikidata.org/sparql"
api_endpoint = "https://www.wikidata.org/w/api.php"
wbgetentities_batch = 50
# Pause between SPARQL queries; they run one at a time.
sparql_pause_seconds = 1.0
api_pause_seconds = 0.2
timeout_seconds = 90
max_retries = 5

[ingest.dewiki]
# German Wikipedia infobox tables: second source for coach spells (trainer_tabelle) and player stints
# (vereine_tabelle, jugendvereine_tabelle). Exception to "Wikidata + pageviews only", approved by T on 2026-11-11.
api_endpoint = "https://de.wikipedia.org/w/api.php"
# Each club's dewiki article title fills {club}; the category's articles are candidate coaches.
coach_category = "Kategorie:Fußballtrainer ({club})"
# Counted only (members with no person in our data), to size how many players we don't have.
player_category = "Kategorie:Fußballspieler ({club})"
titles_per_request = 50
pause_seconds = 0.2

[ingest.pageviews]
wikis = ["de", "en"]
# Earliest month the Wikimedia per-article API serves.
start_month = "2015-07"
agent = "user"
# Wikimedia throttles this API to roughly 5 requests/s per client (measured 2026-11-11: HTTP 429 above that).
max_requests_per_second = 5
concurrency = 4

[ingest.coverage]
# Club-seasons with fewer dated players than this are flagged as thin.
min_squad_size = 20
teams_per_season = 18
# Age at stint start outside this range is flagged as implausible.
min_plausible_age = 15
max_plausible_age = 45
sample_players = 10
sample_seed = 42
